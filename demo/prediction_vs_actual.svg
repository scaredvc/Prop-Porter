<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-labelledby="title desc">
  <title id="title">Prop-Porter prediction vs actual points</title>
  <desc id="desc">Line chart comparing actual and predicted NBA player points on the held-out set.</desc>
  <rect width="900" height="520" fill="#fbfaf5" />
  <text x="60" y="50" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1f2937">Prediction vs Actual Points</text>
  <text x="60" y="78" font-family="Arial, sans-serif" font-size="16" fill="#4b5563">Held-out games from the Prop-Porter baseline experiment</text>

  <line x1="80" y1="420" x2="840" y2="420" stroke="#374151" stroke-width="2" />
  <line x1="80" y1="110" x2="80" y2="420" stroke="#374151" stroke-width="2" />

  <g font-family="Arial, sans-serif" font-size="12" fill="#4b5563">
    <text x="52" y="424">0</text>
    <text x="44" y="363">5</text>
    <text x="38" y="301">10</text>
    <text x="38" y="239">15</text>
    <text x="38" y="177">20</text>
    <text x="38" y="115">25+</text>
  </g>

  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="80" y1="358" x2="840" y2="358" />
    <line x1="80" y1="296" x2="840" y2="296" />
    <line x1="80" y1="234" x2="840" y2="234" />
    <line x1="80" y1="172" x2="840" y2="172" />
    <line x1="80" y1="110" x2="840" y2="110" />
  </g>

  <polyline fill="none" stroke="#d97706" stroke-width="4" points="140,172 300,110 460,98 620,184 780,160" />
  <polyline fill="none" stroke="#2563eb" stroke-width="4" stroke-dasharray="10 8" points="140,137 300,245 460,151 620,108 780,98" />

  <g fill="#d97706">
    <circle cx="140" cy="172" r="5" />
    <circle cx="300" cy="110" r="5" />
    <circle cx="460" cy="98" r="5" />
    <circle cx="620" cy="184" r="5" />
    <circle cx="780" cy="160" r="5" />
  </g>

  <g fill="#2563eb">
    <circle cx="140" cy="137" r="5" />
    <circle cx="300" cy="245" r="5" />
    <circle cx="460" cy="151" r="5" />
    <circle cx="620" cy="108" r="5" />
    <circle cx="780" cy="98" r="5" />
  </g>

  <g font-family="Arial, sans-serif" font-size="12" fill="#111827">
    <text x="120" y="447">Jokic</text>
    <text x="270" y="447">Curry</text>
    <text x="425" y="447">LeBron</text>
    <text x="600" y="447">Jokic</text>
    <text x="750" y="447">Curry</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#374151">
    <text x="660" y="55">Actual</text>
    <line x1="610" y1="50" x2="648" y2="50" stroke="#d97706" stroke-width="4" />
    <text x="660" y="85">Predicted</text>
    <line x1="610" y1="80" x2="648" y2="80" stroke="#2563eb" stroke-width="4" stroke-dasharray="10 8" />
  </g>

  <text x="60" y="490" font-family="Arial, sans-serif" font-size="15" fill="#4b5563">MAE: 5.96 | R²: -0.34</text>
</svg>
